function getMyApprovalApps(){
 const q=(document.getElementById('approvalSearch')?.value||'').trim().toLowerCase(),categoryFilter=document.getElementById('approvalCategoryFilter')?.value||'',groups=new Map();
 for(const request of ledgerApprovalRequests){
  const key=approvalAppKey(request),name=request.appName||'权限申请',category=approvalCategory(request),systemPlatformName=approvalSystemPlatformName(request);
  if(categoryFilter&&category!==categoryFilter)continue;
  const group=groups.get(key)||{key,name,category,systemPlatformName,requests:[]};
  group.requests.push(request);groups.set(key,group)
 }

  const appMatch=!q||[group.name,group.systemPlatformName,group.category].join(' ').toLowerCase().includes(q);

<script>

function ledgerImportMarkup(){return '<div class="import-template-row"><span>员工或权限应用未匹配、匹配到多条，或权限回收人未配置时，该行会提示异常且不会导入。</span><a class="import-template-link" href="人员权限台账导入模板.xlsx" download>下载Excel模板 ↓</a></div><div class="import-upload" id="ledgerImportDrop"><div class="import-upload-copy"><strong>选择Excel文件或拖拽至此处</strong><span>支持 .xlsx 格式；导入前会校验工号、权限名称和匹配结果。</span></div><button type="button" class="btn" onclick="document.getElementById(&quot;ledgerExcelFile&quot;).click()">选择文件</button></div><div class="import-file-name" id="ledgerImportFileName"></div><div class="import-result" id="ledgerImportResult"><div class="import-empty">选择Excel文件后，将在此预览员工、权限应用匹配结果。</div></div>'}

function ledgerXmlText(node){return Array.from(node.getElementsByTagNameNS('*','t')).map(t=>t.textContent||'').join('')}
function ledgerExcelColumnIndex(ref){const letters=(ref||'').match(/^[A-Z]+/i)?.[0]?.toUpperCase()||'';let n=0;for(const ch of letters)n=n*26+ch.charCodeAt(0)-64;return n-1}
function ledgerExcelSerialDate(value){const n=Number(value);if(!Number.isFinite(n)||n<1||n>100000)return String(value||'');const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);return d.toISOString().slice(0,10)}
async function readLedgerWorkbook(file){if(typeof JSZip==='undefined')throw new Error('Excel解析组件未加载，请刷新后重试');const zip=await JSZip.loadAsync(file);const wbFile=zip.file('xl/workbook.xml');const relFile=zip.file('xl/_rels/workbook.xml.rels');if(!wbFile||!relFile)throw new Error('文件不是有效的 .xlsx 工作簿');const wbDoc=new DOMParser().parseFromString(await wbFile.async('string'),'application/xml'),relDoc=new DOMParser().parseFromString(await relFile.async('string'),'application/xml');const sheet=wbDoc.getElementsByTagNameNS('*','sheet')[0];if(!sheet)throw new Error('Excel文件中没有工作表');const rid=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');const rel=Array.from(relDoc.getElementsByTagNameNS('*','Relationship')).find(x=>x.getAttribute('Id')===rid);if(!rel)throw new Error('无法定位Excel工作表');let target=rel.getAttribute('Target')||'';if(target.startsWith('/'))target=target.slice(1);else if(!target.startsWith('xl/'))target='xl/'+target;target=target.replace(/^xl\/\.\.\//,'');const sheetFile=zip.file(target);if(!sheetFile)throw new Error('Excel工作表内容缺失');let shared=[];const sharedFile=zip.file('xl/sharedStrings.xml');if(sharedFile){const sharedDoc=new DOMParser().parseFromString(await sharedFile.async('string'),'application/xml');shared=Array.from(sharedDoc.getElementsByTagNameNS('*','si')).map(ledgerXmlText)}const sheetDoc=new DOMParser().parseFromString(await sheetFile.async('string'),'application/xml');const rows=Array.from(sheetDoc.getElementsByTagNameNS('*','row')).map(row=>{const values=[];for(const cell of Array.from(row.getElementsByTagNameNS('*','c'))){const idx=ledgerExcelColumnIndex(cell.getAttribute('r')),type=cell.getAttribute('t'),v=cell.getElementsByTagNameNS('*','v')[0]?.textContent||'';let value=type==='inlineStr'?ledgerXmlText(cell):type==='s'?(shared[Number(v)]||''):v;if(idx>=0)values[idx]=String(value??'').trim()}return{number:Number(row.getAttribute('r'))||0,values}});const headerRow=rows.find(r=>ledgerRequiredHeaders.every(h=>r.values.includes(h)));if(!headerRow)throw new Error('未找到“工号”和“权限名称”表头，请使用最新的人员权限台账导入模板');const col={};ledgerRequiredHeaders.forEach(h=>col[h]=headerRow.values.indexOf(h));const data=[];for(const r of rows.filter(x=>x.number>headerRow.number)){const employeeId=r.values[col['工号']]||'',permissionName=r.values[col['权限名称']]||'';if(!employeeId&&!permissionName)continue;data.push({line:r.number,employeeId,permissionName})}return data}
function ledgerMatchKey(value){return String(value||'').trim().replace(/\s+/g,' ').toLocaleLowerCase()}

document.getElementById('peopleBody').addEventListener('click',event=>{const link=event.target.closest('.inline-request-link');if(!link)return;event.preventDefault();event.stopPropagation();openLedgerRequest(link.dataset.requestId)});
function getLedgerPermissionCatalog(){const catalog=new Map();ledgerImportSources.permissions.forEach(item=>{const key=ledgerMatchKey(item.name),owner=item.category==='AD域关联的系统平台'?(item.systemRecycler||item.permissionOwner||''):(item.permissionOwner||item.owner||''),existing=catalog.get(key),value={name:String(item.name||'').trim(),category:String(item.category||'').trim(),owner:String(owner||'').trim(),ambiguous:false};if(!existing)catalog.set(key,value);else if(existing.category!==value.category||existing.owner!==value.owner)existing.ambiguous=true});return catalog}
function validateLedgerImport(rows){const seen=new Set(),catalog=getLedgerPermissionCatalog();return rows.map(row=>{const issues=[];if(!String(row.employeeId||'').trim())issues.push('缺少工号');if(!String(row.permissionName||'').trim())issues.push('缺少权限名称');const employee=ledgerImportSources.employees.find(p=>ledgerMatchKey(p.employeeId)===ledgerMatchKey(row.employeeId));if(row.employeeId&&!employee)issues.push('用户管理中未找到该工号');const permission=catalog.get(ledgerMatchKey(row.permissionName));if(row.permissionName&&!permission)issues.push('权限应用配置中未找到该权限名称');else if(permission?.ambiguous)issues.push('权限应用配置中存在同名但类别或回收人不一致的记录');else if(permission&&!permission.owner)issues.push('该权限应用未配置权限回收人');const key=ledgerMatchKey(row.employeeId)+'\u0000'+ledgerMatchKey(row.permissionName);if(row.employeeId&&row.permissionName&&seen.has(key))issues.push('文件内存在重复的工号与权限名称');if(row.employeeId&&row.permissionName)seen.add(key);const person=staffRows.find(p=>ledgerMatchKey(p.id)===ledgerMatchKey(row.employeeId)),existed=!!person?.permissions.some(g=>ledgerMatchKey(g.name)===ledgerMatchKey(row.permissionName));return{...row,name:employee?.name||'',dept:employee?.dept||'',role:employee?.role||'',employmentStatus:employee?.status||'',category:permission?.category||'',owner:permission?.owner||'',granted:person?.permissions.find(g=>ledgerMatchKey(g.name)===ledgerMatchKey(row.permissionName))?.granted||'',error:issues.join('；'),action:existed?'更新已有权限':'新增权限'}})}
async function loadLedgerExcel(file){if(!/\.xlsx$/i.test(file.name)){ledgerImportError='请选择 .xlsx 格式的Excel文件';ledgerImportRows=[];ledgerImportFileName=file.name;renderLedgerImportResult();return}ledgerImportFileName=file.name;ledgerImportRows=[];ledgerImportError='';renderLedgerImportResult('正在读取文件…');try{const rows=await readLedgerWorkbook(file);if(!rows.length)throw new Error('没有读取到权限数据，请确认模板表头下方已填写内容');ledgerImportRows=validateLedgerImport(rows);renderLedgerImportResult()}catch(e){ledgerImportError=e.message||'文件读取失败';renderLedgerImportResult()}}
function renderLedgerImportResult(loading=''){const name=document.getElementById('ledgerImportFileName'),result=document.getElementById('ledgerImportResult'),confirm=document.getElementById('ledgerImportConfirm');if(!name||!result)return;name.style.display=ledgerImportFileName?'block':'none';name.textContent=ledgerImportFileName?'已选择：'+ledgerImportFileName:'';if(loading){result.innerHTML='<div class="import-empty">'+esc(loading)+'</div>';if(confirm)confirm.disabled=true;return}if(ledgerImportError){result.innerHTML='<div class="import-intro" style="border-color:#f2d4d4;background:#fff8f7;color:#b94d55">'+esc(ledgerImportError)+'</div>';if(confirm)confirm.disabled=true;return}if(!ledgerImportRows.length){result.innerHTML='<div class="import-empty">选择Excel文件后，将在此预览匹配和校验结果。</div>';if(confirm)confirm.disabled=true;return}const valid=ledgerImportRows.filter(r=>!r.error).length,invalid=ledgerImportRows.length-valid,shown=ledgerImportRows.slice(0,100);const preview='<div class="import-summary"><span>读取 <b>'+ledgerImportRows.length+'</b> 条</span><span class="ok">匹配通过 <b>'+valid+'</b> 条</span><span class="bad">异常 <b>'+invalid+'</b> 条</span></div><div class="import-preview-wrap"><table class="import-preview"><thead><tr><th>行号</th><th>员工工号 / 姓名</th><th>所属部门</th><th>权限名称 / 类别</th><th>权限回收人</th><th>导入方式</th><th>校验结果</th></tr></thead><tbody>'+shown.map(r=>'<tr class="'+(r.error?'import-row-error':'')+'"><td>'+r.line+'</td><td>'+esc(r.employeeId)+'<br>'+esc(r.name||'—')+'</td><td>'+esc(r.dept||'—')+'</td><td>'+esc(r.permissionName)+'<br>'+esc(r.category||'—')+'</td><td>'+esc(r.owner||'—')+'</td><td>'+esc(r.action)+'</td><td class="'+(r.error?'import-error-text':'import-valid-text')+'">'+esc(r.error||'匹配成功')+'</td></tr>').join('')+'</tbody></table></div>'+(ledgerImportRows.length>shown.length?'<div class="field-hint" style="margin-top:7px">预览前100条，其余数据确认后一起导入。</div>':'');result.innerHTML=preview;if(confirm)confirm.disabled=invalid>0||valid===0}
function refreshLedgerDepartments(){const select=document.getElementById('deptFilter'),current=select.value;select.innerHTML='<option value="">部门</option>';[...new Set(staffRows.map(p=>p.dept))].sort().forEach(d=>select.insertAdjacentHTML('beforeend','<option>'+esc(d)+'</option>'));select.value=[...select.options].some(o=>o.value===current)?current:''}
function confirmLedgerImport(){const rows=ledgerImportRows;if(!rows.length||rows.some(r=>r.error)){showToast('请先处理导入数据中的异常');return}let newPeople=0,newPermissions=0,updatedPermissions=0;for(const r of rows){const employee=ledgerImportSources.employees.find(p=>ledgerMatchKey(p.employeeId)===ledgerMatchKey(r.employeeId));if(!employee)continue;let person=staffRows.find(p=>ledgerMatchKey(p.id)===ledgerMatchKey(r.employeeId));if(!person){person={id:employee.employeeId,name:employee.name,dept:employee.dept,role:employee.role||'—',status:employee.status==='待离职'?'待离职':'在职',permissions:[]};staffRows.push(person);newPeople++}else{person.name=employee.name;person.dept=employee.dept;person.role=employee.role||person.role;person.status=employee.status==='待离职'?'待离职':'在职'}let permission=person.permissions.find(g=>ledgerMatchKey(g.name)===ledgerMatchKey(r.permissionName));if(permission){Object.assign(permission,{category:r.category,owner:r.owner,notified:false,notifiedAt:'',recoveryDate:'',recoveryConfirmedAt:'',recovered:false,recoveryStatus:''});updatedPermissions++}else{person.permissions.push({id:'import-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name:r.permissionName.trim(),category:r.category,owner:r.owner,granted:'',notified:false});newPermissions++}}ledgerImportRows=[];ledgerImportFileName='';selectedPeople.clear();selectedGrantKeys.clear();closeDrawer();refreshLedgerDepartments();renderPeople();showToast('导入完成：新增 '+newPeople+' 人，新增 '+newPermissions+' 项权限，更新 '+updatedPermissions+' 项权限')}
window.addEventListener('message',event=>{const data=event.data;if(data?.type!=='ledger-import-sources'||!Array.isArray(data.employees)||!Array.isArray(data.permissions))return;ledgerImportSources={employees:data.employees,permissions:data.permissions};ledgerApplicationRequests=Array.isArray(data.requests)?data.requests:[];ledgerApprovalRequests=Array.isArray(data.actedRequests)?data.actedRequests:[];ledgerApplicationRequests.forEach(request=>{if(!request.recoveryStatus&&!request.recovered)return;const grant=findGrantForRequest(request);if(!grant)return;grant.recovered=request.recovered===true||request.recoveryStatus==='已回收';grant.notified=request.recoveryStatus==='待回收'||grant.recovered;grant.recoveryStatus=request.recoveryStatus||'';grant.recoveryDate=request.recoveryDate||grant.recoveryDate||'';grant.recoveryConfirmedAt=request.recoveryConfirmedAt||'';grant.notifiedAt=request.recoveryNotifiedAt||grant.notifiedAt||''});refreshApprovalCategories();renderPeople();renderMyApprovals()});
renderMyApprovals();
function publishLedgerFixture(){window.parent.postMessage({type:'ledger-fixture',grants:staffRows.flatMap(person=>(person.permissions||[]).map(permission=>({employeeId:person.id,applicantName:person.name,department:person.dept,permissionName:permission.name,category:permission.category,owner:permission.owner,granted:permission.granted||'',requestId:permission.requestId||'',notified:permission.notified===true,recovered:permission.recovered===true,recoveryStatus:permission.recovered===true?'已回收':permission.notified===true?'待回收':'',notifiedAt:permission.notifiedAt||'',recoveryDate:permission.recoveryDate||'',recoveryConfirmedAt:permission.recoveryConfirmedAt||''})))},'*')}
publishLedgerFixture();

</script>
